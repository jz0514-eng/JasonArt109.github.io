<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forest</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <main class="scene">

    <img src="images/forest.png" class="scene-image" alt="Forest">

    <img src="images/stick.png" class="object-image" id="stick" alt="">
    <img src="images/downarrow.png" class="object-image" id="down" alt="">

    <button id="stickButton" class="hotspot stick-area"></button>
    <a href="index.html" id="downButton" class="hotspot down-area"></a>

    <div id="popup" class="popup hidden">
      <div class="popup-box">
        <button id="closePopup">X</button>
        <p id="popupText"></p>
      </div>
    </div>

  </main>

</body>
</html>
