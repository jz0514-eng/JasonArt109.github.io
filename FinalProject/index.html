<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Camp</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body id="page">

  <main class="scene">


    <img src="images/camp.png" class="scene-image" alt="Camp">


    <img src="images/tent.png" class="object-image" id="tent" alt="">
    <img src="images/firepit.png" class="object-image" id="fire" alt="">
    <img src="images/fire.png" class="object-image hidden" id="fireLit" alt="">
    <img src="images/uparrow.png" class="object-image" id="up" alt="">
    <img src="images/rightarrow.png" class="object-image" id="right" alt="">


    <button id="tentButton" class="hotspot tent-area"></button>
    <button id="fireButton" class="hotspot fire-area"></button>

    <a href="forest.html" id="upButton" class="hotspot up-area"></a>
    <a href="river.html" id="rightButton" class="hotspot right-area"></a>

    <div id="popup" class="popup hidden">
      <div class="popup-box">
        <button id="closePopup">X</button>
        <p id="popupText"></p>
      </div>
    </div>

  </main>

</body>

</html>
