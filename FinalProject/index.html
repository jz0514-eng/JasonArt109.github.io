<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campsite</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>

<body class="camp-page day-mode">

    <main class="scene camp-scene">

        <!-- background parts -->
        <div class="sky"></div>
        <div class="ground"></div>

        <!-- camp objects -->
        <button class="camp-object tent-bag" id="tentObject">
            Tent Bag
        </button>

        <button class="camp-object backpack" id="backpackObject">
            Backpack
        </button>

        <button class="camp-object dropped-map hidden" id="droppedMap">
            Map
        </button>

        <button class="camp-object fire-ring" id="fireRing">
            Empty Fireplace
        </button>

        <!-- popup map window -->
        <div class="popup hidden" id="mapPopup">
            <div class="popup-content">
                <button class="close-button" id="closeMap">X</button>

                <h2>Map</h2>
                <p>place holder</p>

                <div class="map-links">
                    <a href="forest.html">Forest</a>
                    <a href="river.html">River</a>
                    <a href="beach.html">Beach</a>
                </div>
            </div>
        </div>

    </main>

</body>

</html>
